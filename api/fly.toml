# Deployed from the repository root, so the build context carries package.json:
#
#   fly deploy -c api/fly.toml
#
# Its own app, its own version number and its own deploy. `fly status` on this
# app and on `pointer-deploy` move independently, which is the fourth schedule
# TODO's item 13 is about.

app = "pointer-deploy-api"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  # `PLAN.md` step 6 made this service stateless: it holds a bucket key, and
  # the bucket holds the snapshots. Nothing is in memory between requests, so
  # a machine that stops loses nothing and the next request starts one.
  #
  # It said `off` with `min_machines_running = 1` until then, and the comment
  # gave the reason: the state was in memory, so a stopped machine would have
  # answered with a default greeting and no counters - a data loss dressed as
  # a cold start. That reason is gone with the greeting.
  auto_stop_machines = "suspend"
  min_machines_running = 0

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/healthz"
