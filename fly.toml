app = "pointer-deploy"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  # Filled in once `fly storage create` names the bucket.
  MANIFEST_BASE = "https://pointer-deploy-assets.fly.storage.tigris.dev/manifests"
  MANIFEST_TTL_MS = "10000"
  PORT = "8080"
  # §13. Where the page is told to find the service. Configuration and not a
  # credential - it is a public URL the browser calls directly - so it is
  # recorded here rather than set as a secret, and the two deploys stay
  # independent: this names the service, and the service knows nothing of this.
  API_BASE = "https://pointer-deploy-api.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_start_machines = true
  auto_stop_machines = "suspend"
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/healthz"
